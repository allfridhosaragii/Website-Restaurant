[phases.setup]
nixPkgs = ["...", "php83", "php83Extensions.fileinfo", "php83Extensions.pdo", "php83Extensions.pdo_mysql", "php83Extensions.mbstring", "php83Extensions.openssl", "php83Extensions.tokenizer", "php83Extensions.xml", "php83Extensions.ctype", "php83Extensions.bcmath", "php83Extensions.curl", "php83Extensions.gd"]

[phases.build]
cmds = ["npm install", "npm run build", "composer install --no-dev --optimize-autoloader"]

[start]
cmd = "php -d upload_max_filesize=200M -d post_max_size=200M -d memory_limit=512M -d max_execution_time=600 artisan serve --host=0.0.0.0 --port=${PORT:-8080}"
